<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0810"/>
      <stop offset="100%" stop-color="#12101a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0891B2" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0891B2" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#0891B2" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0891B2" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <rect width="960" height="720" fill="url(#bg)"/>
  <circle cx="780" cy="120" r="180" fill="#0891B2" opacity="0.08" filter="url(#soft)"/>
  <circle cx="140" cy="620" r="160" fill="#0891B2" opacity="0.05" filter="url(#soft)"/>

  <rect x="120" y="80" width="720" height="560" rx="24" fill="url(#panel)" stroke="#67E8F9" stroke-opacity="0.35" stroke-width="1.5"/>
  <rect x="120" y="80" width="720" height="56" rx="24" fill="#0891B2" fill-opacity="0.15"/>
  <circle cx="154" cy="108" r="6" fill="#f87171"/><circle cx="178" cy="108" r="6" fill="#fbbf24"/><circle cx="202" cy="108" r="6" fill="#4ade80"/>
  <text x="240" y="114" fill="#FFFFFF" font-family="ui-monospace" font-size="13">FORE · Decide</text>
  <!-- three faces tabs -->
  <g font-family="ui-monospace" font-size="12">
    <rect x="160" y="160" width="90" height="32" rx="8" fill="#0891B2" fill-opacity="0.15"/><text x="205" y="180" text-anchor="middle" fill="#67E8F9">PAST</text>
    <rect x="260" y="160" width="100" height="32" rx="8" fill="#0891B2"/><text x="310" y="180" text-anchor="middle" fill="#0a0810" font-weight="700">DECIDE</text>
    <rect x="370" y="160" width="100" height="32" rx="8" fill="#0891B2" fill-opacity="0.15"/><text x="420" y="180" text-anchor="middle" fill="#67E8F9">AHEAD</text>
  </g>
  <rect x="160" y="220" width="400" height="52" rx="14" fill="#FFFFFF" fill-opacity="0.06"/>
  <text x="180" y="252" fill="#FFFFFF" font-family="system-ui" font-size="16">Can I afford ₹15,000 this month?</text>
  <!-- tool call chip -->
  <rect x="160" y="300" width="280" height="36" rx="8" fill="#0891B2" fill-opacity="0.2" stroke="#67E8F9" stroke-opacity="0.45"/>
  <text x="178" y="323" fill="#67E8F9" font-family="ui-monospace" font-size="12">⚙ tool_call · affordability()</text>
  <rect x="160" y="360" width="640" height="160" rx="16" fill="#0a0810" fill-opacity="0.55" stroke="#67E8F9" stroke-opacity="0.25"/>
  <text x="184" y="410" fill="#67E8F9" font-family="ui-monospace" font-size="12">COMPUTED RESULT</text>
  <text x="184" y="460" fill="#FFFFFF" font-family="Space Grotesk" font-size="40" font-weight="700">Yes · ₹15,000</text>
  <text x="184" y="495" fill="#67E8F9" font-family="system-ui" font-size="14">Narrated from a real number — not invented.</text>
  <text x="480" y="600" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace" font-size="12" opacity="0.45">ONE financial_context · THREE FACES · LIVE ON VERCEL</text>

</svg>
