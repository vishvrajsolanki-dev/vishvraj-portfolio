<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0810"/>
      <stop offset="100%" stop-color="#12101a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#E11D48" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E11D48" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <rect width="960" height="720" fill="url(#bg)"/>
  <circle cx="780" cy="120" r="180" fill="#E11D48" opacity="0.08" filter="url(#soft)"/>
  <circle cx="140" cy="620" r="160" fill="#E11D48" opacity="0.05" filter="url(#soft)"/>

  <rect x="70" y="80" width="820" height="560" rx="24" fill="url(#panel)" stroke="#FB7185" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="100" y="125" fill="#FB7185" font-family="ui-monospace" font-size="14" letter-spacing="0.18em">ONE INTELLIGENCE LAYER</text>
  <!-- ASK -->
  <rect x="100" y="160" width="240" height="420" rx="18" fill="#0a0810" fill-opacity="0.55" stroke="#FB7185" stroke-opacity="0.3"/>
  <text x="124" y="200" fill="#FB7185" font-family="ui-monospace" font-size="12" letter-spacing="0.16em">ASK</text>
  <text x="124" y="235" fill="#FFFFFF" font-family="system-ui" font-size="15">“Hotspots near Zone 7 tonight?”</text>
  <rect x="124" y="270" width="190" height="70" rx="10" fill="#E11D48" fill-opacity="0.15"/>
  <text x="140" y="300" fill="#FFFFFF" font-family="system-ui" font-size="13">Cited answer</text>
  <text x="140" y="322" fill="#FB7185" font-family="ui-monospace" font-size="11">Advisor + Critic</text>
  <!-- SEE -->
  <rect x="360" y="160" width="240" height="420" rx="18" fill="#0a0810" fill-opacity="0.55" stroke="#FB7185" stroke-opacity="0.3"/>
  <text x="384" y="200" fill="#FB7185" font-family="ui-monospace" font-size="12" letter-spacing="0.16em">SEE</text>
  <rect x="384" y="230" width="192" height="160" rx="12" fill="#E11D48" fill-opacity="0.08" stroke="#FB7185" stroke-opacity="0.25"/>
  <circle cx="450" cy="300" r="8" fill="#E11D48"/><circle cx="500" cy="280" r="6" fill="#FB7185"/><circle cx="520" cy="330" r="7" fill="#E11D48" opacity="0.7"/>
  <path d="M450 300 L500 280 L520 330" stroke="#FB7185" stroke-width="1.5" opacity="0.5"/>
  <text x="384" y="430" fill="#FFFFFF" font-family="system-ui" font-size="14">Hotspot map</text>
  <text x="384" y="455" fill="#FB7185" font-family="ui-monospace" font-size="12">Case link graph</text>
  <!-- PREDICT -->
  <rect x="620" y="160" width="240" height="420" rx="18" fill="#0a0810" fill-opacity="0.55" stroke="#FB7185" stroke-opacity="0.3"/>
  <text x="644" y="200" fill="#FB7185" font-family="ui-monospace" font-size="12" letter-spacing="0.16em">PREDICT</text>
  <text x="644" y="250" fill="#FFFFFF" font-family="Space Grotesk" font-size="42" font-weight="700">0.72</text>
  <text x="644" y="280" fill="#FB7185" font-family="ui-monospace" font-size="12">ZONE-TIME RISK</text>
  <rect x="644" y="320" width="180" height="10" rx="5" fill="#E11D48" opacity="0.25"/>
  <rect x="644" y="320" width="130" height="10" rx="5" fill="#E11D48"/>
  <text x="644" y="370" fill="#FFFFFF" font-family="system-ui" font-size="13">SHAP drivers</text>
  <text x="644" y="400" fill="#FB7185" font-family="ui-monospace" font-size="11">hour · density · prior</text>
  <text x="644" y="520" fill="#FFFFFF" font-family="ui-monospace" font-size="12" opacity="0.5">0 PERSON-LEVEL SCORES</text>

</svg>
