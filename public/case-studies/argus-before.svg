<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07060c"/>
      <stop offset="100%" stop-color="#160a10"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1018"/>
      <stop offset="100%" stop-color="#14080c"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>
  <rect width="960" height="720" fill="url(#bg)"/>
  <circle cx="120" cy="100" r="160" fill="#E11D48" opacity="0.1" filter="url(#blur)"/>
  <circle cx="840" cy="620" r="180" fill="#BE123C" opacity="0.1" filter="url(#blur)"/>

  <text x="80" y="78" fill="#FB7185" font-family="ui-monospace,Menlo,monospace" font-size="13" letter-spacing="0.2em">FRAGMENTED INTEL WORKFLOW</text>

  <!-- chat window -->
  <g transform="translate(70,120) rotate(-7)">
    <rect width="280" height="300" rx="16" fill="url(#panel)" stroke="#FB7185" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect width="280" height="44" rx="16" fill="#E11D48" fill-opacity="0.2"/>
    <text x="20" y="28" fill="#FFFFFF" font-family="system-ui,sans-serif" font-size="14" font-weight="600">Case Chat</text>
    <text x="20" y="78" fill="#FB7185" font-family="ui-monospace,Menlo,monospace" font-size="11">NO CITATIONS</text>
    <rect x="20" y="100" width="200" height="40" rx="10" fill="#FFFFFF" fill-opacity="0.06"/>
    <rect x="40" y="160" width="220" height="56" rx="10" fill="#E11D48" fill-opacity="0.12"/>
    <text x="56" y="194" fill="#FFFFFF" font-family="system-ui,sans-serif" font-size="13" opacity="0.55">Ungrounded reply…</text>
    <rect x="20" y="240" width="160" height="12" rx="4" fill="#FB7185" opacity="0.2"/>
    <rect x="20" y="264" width="120" height="12" rx="4" fill="#FB7185" opacity="0.12"/>
  </g>

  <!-- map window -->
  <g transform="translate(360,180) rotate(5)">
    <rect width="300" height="280" rx="16" fill="url(#panel)" stroke="#FB7185" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect width="300" height="44" rx="16" fill="#E11D48" fill-opacity="0.2"/>
    <text x="20" y="28" fill="#FFFFFF" font-family="system-ui,sans-serif" font-size="14" font-weight="600">District Map</text>
    <text x="20" y="78" fill="#FB7185" font-family="ui-monospace,Menlo,monospace" font-size="11">STATIC EXPORT · NO LINKS</text>
    <rect x="24" y="100" width="252" height="140" rx="12" fill="#E11D48" fill-opacity="0.08" stroke="#FB7185" stroke-opacity="0.2"/>
    <circle cx="80" cy="160" r="7" fill="#E11D48"/><circle cx="150" cy="140" r="6" fill="#FB7185" opacity="0.7"/><circle cx="200" cy="180" r="8" fill="#E11D48" opacity="0.55"/>
    <circle cx="120" cy="200" r="5" fill="#FB7185" opacity="0.5"/>
    <text x="24" y="270" fill="#FFFFFF" font-family="ui-monospace,Menlo,monospace" font-size="11" opacity="0.45">PNG dump · stale</text>
  </g>

  <!-- risk spreadsheet -->
  <g transform="translate(680,110) rotate(-4)">
    <rect width="240" height="250" rx="16" fill="url(#panel)" stroke="#FB7185" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect width="240" height="44" rx="16" fill="#E11D48" fill-opacity="0.2"/>
    <text x="20" y="28" fill="#FFFFFF" font-family="system-ui,sans-serif" font-size="14" font-weight="600">Risk Sheet</text>
    <text x="20" y="78" fill="#FB7185" font-family="ui-monospace,Menlo,monospace" font-size="11">MANUAL · NO SHAP</text>
    <text x="20" y="140" fill="#FFFFFF" font-family="Space Grotesk,system-ui,sans-serif" font-size="48" font-weight="700" opacity="0.3">???</text>
    <rect x="20" y="170" width="180" height="10" rx="4" fill="#FB7185" opacity="0.2"/>
    <rect x="20" y="194" width="140" height="10" rx="4" fill="#FB7185" opacity="0.12"/>
    <text x="20" y="230" fill="#FFFFFF" font-family="ui-monospace,Menlo,monospace" font-size="11" opacity="0.45">Black-box score</text>
  </g>

  <rect x="240" y="620" width="480" height="40" rx="12" fill="#E11D48" fill-opacity="0.12" stroke="#FB7185" stroke-opacity="0.3"/>
  <text x="480" y="645" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace,Menlo,monospace" font-size="13" letter-spacing="0.08em">THREE TOOLS · ZERO SHARED SPINE · PERSON RISK UNCHECKED</text>
</svg>
